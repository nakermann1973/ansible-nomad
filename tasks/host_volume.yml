---
- name: Create host volumes
  ansible.builtin.file:
    path: "{{ item['path'] }}"
    owner: "{{ item['owner'] | default(nomad_user) }}"
    group: "{{ item['group'] | default(nomad_group) }}"
    state: "{{ item['state'] | default('directory') }}"
    mode: "{{ item['mode'] | default('0755') }}"
  loop: "{{ nomad_host_volumes }}"
  loop_control:
    label: "{{ item.name }}"
